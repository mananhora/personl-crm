function ImportView({ contacts, settings, store, ai, toast, go, drill }) {
  const [job, setJob] = useState(null);
  const [err, setErr] = useState('');
  const [over, setOver] = useState(false);
  const [busy, setBusy] = useState('');
  const [progress, setProgress] = useState(null);
  const [done, setDone] = useState(null);
  const [paste, setPaste] = useState('');
  const [shots, setShots] = useState([]);
  const fileRef = useRef(); const hintRef = useRef('');
  const shotRef = useRef();

  const choose = (hint) => { hintRef.current = hint; setErr(''); fileRef.current.value = ''; fileRef.current.click(); };
  const handleFiles = async (files) => {
    const f = files && files[0]; if (!f) return;
    setErr(''); setDone(null);
    if (/^image\//.test(f.type)) { setShots([...files].filter((x) => /^image\//.test(x.type))); window.scrollTo({ top: 0 }); return; }
    try { const j = await parseFile(f, hintRef.current); setJob(initJob(j)); }
    catch (e) { setErr(e.message || 'Could not read that file.'); }
  };
  const initJob = (j) => {
    const info = SOURCE_INFO[j.source] || SOURCE_INFO.csv;
    return { ...j, tier: info.tier, tag: info.tag, q: '', excluded: new Set(), showMap: j.kind === 'csv' && j.source !== 'linkedin' };
  };
  const runAI = async () => {
    if (!ai) return;
    setBusy('Reading…'); setErr('');
    const prompt = `You extract people for a personal CRM. ${shots.length ? 'The attached image(s) are screenshots (for example a contacts table, a LinkedIn profile or a business card).' : ''}
List every distinct person in the material below. Reply with ONLY a JSON object of this shape:
{"people":[{"name":"","company":"","role":"","location":"","country":"","email":"","phone":"","linkedin":"","howWeMet":"","birthday":"","tier":null,"tags":[],"notes":""}]}
Rules: use "" for anything not stated; never invent details. "location" is a city or region. "birthday" is YYYY-MM-DD, or --MM-DD without a year. "tier" is 1-4 only when the material states a tier, circle or relationship level (e.g. "Tier 2" → 2), else null. Put any other useful facts in "notes" as short plain sentences.
${paste.trim() ? 'MATERIAL:\n' + paste.trim() : 'MATERIAL: see the attached image(s).'}`;
    try {
      const res = await ai.sample.json(prompt, shots.length ? { images: shots } : {});
      const list = (res && Array.isArray(res.people) ? res.people : Array.isArray(res) ? res : []).map((p) => ({
        name: String(p.name || '').trim(), company: p.company || '', role: p.role || '', location: p.location || '', country: p.country || '',
        email: p.email || '', phone: p.phone || '', linkedin: p.linkedin || '', howWeMet: p.howWeMet || '', notes: p.notes || '',
        birthday: parseBirthday(p.birthday) || '', tier: [1, 2, 3, 4].includes(+p.tier) ? +p.tier : undefined, tags: uniqTags((p.tags || []).map(cleanTag)), extra: {},
      })).filter((p) => p.name);
      if (!list.length) setErr("Couldn't find any people in that. Try pasting more detail.");
      else { setJob(initJob({ source: 'ai', fileName: shots.length ? plural(shots.length, 'screenshot') : 'pasted text', kind: 'records', records: list })); setPaste(''); setShots([]); }
    } catch (e) {
      const code = e && e.code;
      setErr(code === 'not_granted' || code === 'declined' ? 'Smart paste needs your permission to ask Claude. You can allow it from the artifact menu.' :
        code === 'rate_limited' ? 'Too many requests right now. Wait a minute and try again.' :
        code === 'images_unavailable' ? 'Screenshots are not supported in this view. Paste text instead.' : 'Claude could not read that. Try again with a little more text.');
    } finally { setBusy(''); }
  };

  const records = useMemo(() => {
    if (!job) return [];
    if (job.kind === 'records') return job.records;
    return job.rows.map((r) => recordFromRow(r, job.headers, job.mapping)).filter((r) => r.name);
  }, [job && job.kind, job && job.records, job && job.rows, job && job.mapping]);

  const plan = useMemo(() => {
    if (!job) return [];
    const m = makeMatcher(contacts);
    const seenNew = makeMatcher([]);
    return records.map((r, idx) => {
      const ex = m.find(r);
      if (ex) return { r, idx, match: ex };
      const dup = seenNew.find(r);
      if (dup) return { r, idx, match: null, dupOf: dup.idx };
      seenNew.add({ ...r, id: 'tmp' + idx, idx });
      return { r, idx, match: null };
    });
  }, [records, contacts]);

  const included = plan.filter((p) => !job.excluded.has(p.idx));
  const nNew = included.filter((p) => !p.match && p.dupOf == null).length;
  const nUpd = included.length - nNew;

  const execute = async () => {
    const t = nowStamp();
    const out = new Map();
    const idxToId = new Map();
    const tagList = job.tag ? splitTags(job.tag) : [];
    for (const p of included) {
      const r = { ...p.r, tags: uniqTags([...(p.r.tags || []), ...tagList]) };
      const targetId = p.match ? p.match.id : p.dupOf != null ? idxToId.get(p.dupOf) : null;
      const base = targetId ? (out.get(targetId) || (p.match && p.match.id === targetId ? p.match : null)) : null;
      if (base) { out.set(base.id, mergeContact(base, r)); idxToId.set(p.idx, base.id); continue; }
      const tier = r.tier || job.tier;
      const c = job.source === 'backup'
        ? normalizeContact({ ...r, id: r.id || uid() })
        : blankContact(settings, { ...r, id: uid(), tier, cadence: settings.tiers[tier - 1].cadence, source: SOURCE_INFO[job.source].label, createdAt: t, updatedAt: t });
      if (r.lastContacted && !c.lastContacted) c.lastContacted = r.lastContacted;
      out.set(c.id, c); idxToId.set(p.idx, c.id);
    }
    const list = [...out.values()];
    setProgress({ done: 0, total: list.length });
    try {
      await store.putMany(list, (n) => setProgress({ done: n, total: list.length }));
      if (job.source === 'backup' && job.settings) await store.saveSettings(job.settings);
      setDone({ created: nNew, updated: list.length - nNew, tag: tagList[0] || '' });
      setJob(null);
    } catch (e) {
      setErr(e && e.code === 'quota_exceeded' ? 'Storage is full. Delete some people or import fewer at once.' : 'Some people could not be saved. Check your connection and import again; duplicates will merge.');
    } finally { setProgress(null); }
  };

  const onDrop = (e) => { e.preventDefault(); setOver(false); handleFiles(e.dataTransfer.files); };
  const fileInput = html`<input ref=${fileRef} type="file" hidden accept=".csv,.vcf,.vcard,.json,.txt,text/csv,text/vcard,application/json" onChange=${(e) => handleFiles(e.target.files)} />`;

  if (progress) {
    return html`<div class="page"><div class="panel" style="display:flex;flex-direction:column;gap:14px;max-width:560px;margin:10vh auto 0">
      <h2>Saving people…</h2><div class="progress"><i style=${{ width: (progress.total ? (progress.done / progress.total) * 100 : 0) + '%' }}></i></div>
      <span class="muted num">${progress.done} of ${progress.total}</span></div></div>`;
  }

  if (job) {
    const q = norm(job.q);
    const visible = plan.filter((p) => !q || norm([p.r.name, p.r.company, p.r.location, p.r.email].join(' ')).includes(q));
    const setJ = (patch) => setJob({ ...job, ...patch });
    const setAll = (on, pred = () => true) => { const ex = new Set(job.excluded); visible.forEach((p) => { if (pred(p)) { on ? ex.delete(p.idx) : ex.add(p.idx); } }); setJ({ excluded: ex }); };
    return html`<div class="page">
      <div class="page-h"><div><div class="eyebrow">Import · ${SOURCE_INFO[job.source].label}</div><h1>Review ${plural(records.length, 'person')}</h1>
        <p>From <b>${job.fileName}</b>. People who are already in MyVillage get merged, never duplicated.</p></div>
        <button class="btn ghost" onClick=${() => setJob(null)}><${Icon} n="x" cls="sm" />Cancel</button></div>
      ${err && html`<div class="banner"><span class="grow">${err}</span></div>`}
      ${job.kind === 'csv' && html`<div class="panel">
        <div class="panel-h"><h2>Columns</h2><button class="btn sm ghost" onClick=${() => setJ({ showMap: !job.showMap })}>${job.showMap ? 'Hide' : `Check how ${job.headers.length} columns are read`}</button></div>
        ${job.showMap ? html`<div class="map-grid">${job.headers.map((hd, i) => html`<div class="map-item">
          <div class="h">${hd || `Column ${i + 1}`}</div>
          <div class="ex">${(job.rows.find((r) => (r[i] || '').trim()) || [])[i] || 'empty'}</div>
          <select class="select" style="min-height:34px" value=${job.mapping[i]} onChange=${(e) => { const m = job.mapping.slice(); m[i] = e.target.value; setJ({ mapping: m }); }}>
            ${FIELD_OPTIONS.map(([k, l]) => html`<option value=${k}>${l}</option>`)}</select></div>`)}</div>`
        : html`<p class="muted" style="margin:0">${job.mapping.filter((m) => m !== 'skip' && m !== 'extra').length} columns matched to fields. Others are kept as extra details on each person.</p>`}
      </div>`}
      <div class="panel">
        <div class="opts">
          <label class="fld"><span>Circle for new people</span>
            <select class="select" value=${job.tier} onChange=${(e) => setJ({ tier: +e.target.value })}>
              ${settings.tiers.map((t, i) => html`<option value=${i + 1}>${i + 1} · ${t.label} (${cadenceLabel(t.cadence).toLowerCase()})</option>`)}</select></label>
          <label class="fld"><span>Tag everyone in this import</span><input class="input" value=${job.tag} placeholder="e.g. linkedin" onInput=${(e) => setJ({ tag: e.target.value })} /></label>
        </div>
        <p class="faint" style="font-size:12.5px;margin:10px 0 0">If a row already says which tier someone is in (like Notion's Relationship column), that wins.</p>
      </div>
      <div class="panel" style="padding:0;overflow:hidden">
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px">
          <label class="search" style="flex:1 1 200px"><${Icon} n="search" /><input class="input" placeholder="Find in this file" value=${job.q} onInput=${(e) => setJ({ q: e.target.value })} /></label>
          <button class="btn sm" onClick=${() => setAll(true)}>Select all</button>
          <button class="btn sm" onClick=${() => setAll(false)}>Select none</button>
          ${job.source === 'phone' && html`<button class="btn sm" title="Keep only people with a company or email" onClick=${() => { setAll(false); setAll(true, (p) => p.r.company || p.r.email); }}>Only with work info</button>`}
        </div>
        <div style="max-height:56vh;overflow:auto;border-top:1px solid var(--line)">
          ${visible.slice(0, 400).map((p) => { const on = !job.excluded.has(p.idx); return html`<button key=${p.idx} class=${'prev-row' + (on ? '' : ' off')}
              onClick=${() => { const ex = new Set(job.excluded); on ? ex.add(p.idx) : ex.delete(p.idx); setJ({ excluded: ex }); }}>
            <span class=${'check' + (on ? ' on' : '')}>${on && html`<${Icon} n="check" />`}</span>
            <${Avatar} c=${{ name: p.r.name, id: p.r.name }} size=${32} />
            <span style="min-width:0"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.r.name}</div>
              <div class="faint" style="font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${[subline(p.r), p.r.location, p.r.tier ? settings.tiers[p.r.tier - 1].label : ''].filter(Boolean).join(' · ') || '—'}</div></span>
            ${p.match ? html`<span class="pill st-snoozed" title=${'Merges into ' + p.match.name}>Merge</span>` : p.dupOf != null ? html`<span class="pill st-none">Duplicate row</span>` : html`<span class="pill st-ok">New</span>`}
          </button>`; })}
          ${visible.length > 400 && html`<div class="faint" style="padding:12px;text-align:center">Showing 400 of ${visible.length}. Search to find someone specific. Selection still applies to everyone.</div>`}
        </div>
      </div>
      <div class="import-bar">
        <span class="muted num">${nNew} new · ${nUpd} merged</span>
        <button class="btn primary" disabled=${!included.length} onClick=${execute}><${Icon} n="upload" cls="sm" />Import ${plural(included.length, 'person')}</button>
      </div>
    </div>`;
  }

  return html`<div class="page" onDragOver=${(e) => { e.preventDefault(); setOver(true); }} onDragLeave=${() => setOver(false)} onDrop=${onDrop}>
    ${fileInput}
    <div class="page-h"><div><h1>Bring your people in</h1><p>Export from wherever they live, then drop the file here. You'll review everyone before anything is saved.</p></div></div>
    ${done && html`<div class="banner" style="background:var(--ok-soft)"><${Icon} n="check" /><span class="grow"><b>Done.</b> ${plural(done.created, 'new person')} added${done.updated ? `, ${done.updated} merged into people you already had` : ''}.</span>
      ${done.tag ? html`<button class="btn sm" onClick=${() => drill({ tags: [done.tag] })}>See them</button>` : html`<button class="btn sm" onClick=${() => go('people')}>See everyone</button>`}</div>`}
    ${err && html`<div class="banner"><span class="grow">${err}</span><button class="btn sm ghost" onClick=${() => setErr('')}>Dismiss</button></div>`}
    <div class=${'drop' + (over ? ' over' : '')} role="button" tabindex="0" style="cursor:pointer" onClick=${() => choose('')} onKeyDown=${(e) => { if (e.key === 'Enter') choose(''); }}>
      <${Icon} n="upload" cls="lg" /><h3>Drop a .csv, .vcf or backup file</h3>
      <span>or <span class="btn sm">choose a file</span></span>
    </div>
    ${ai && html`<div class="panel" style="display:flex;flex-direction:column;gap:10px">
      <div class="panel-h" style="margin:0"><h2 style="display:flex;gap:8px;align-items:center"><${Icon} n="sparkles" />Smart paste</h2><span class="faint">powered by Claude</span></div>
      <p class="muted" style="margin:0">Paste anything: a LinkedIn profile, an email signature, a list of names with notes. ${ai.limits && ai.limits.images ? 'Or add screenshots, like your Notion table or a business card.' : ''}</p>
      <textarea class="textarea" style="min-height:90px" placeholder=${'Priya Shah, PM at Stripe in SF. Met at Sam\'s wedding. Loves bouldering.\nJordan Lee — jordan@acme.co — Acme, Seattle'} value=${paste} onInput=${(e) => setPaste(e.target.value)}></textarea>
      ${shots.length > 0 && html`<div class="chips">${shots.map((f, i) => html`<span class="tag"><${Icon} n="file" cls="sm" />${f.name}<button aria-label="Remove" onClick=${() => setShots(shots.filter((_, j) => j !== i))}><${Icon} n="x" cls="sm" /></button></span>`)}</div>`}
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn primary" disabled=${!!busy || (!paste.trim() && !shots.length)} onClick=${runAI}><${Icon} n="sparkles" cls="sm" />${busy || 'Find people'}</button>
        ${ai.limits && ai.limits.images && html`<button class="btn" onClick=${() => shotRef.current.click()}><${Icon} n="file" cls="sm" />Add screenshots</button>
          <input ref=${shotRef} type="file" hidden multiple accept=${ai.limits.images.mediaTypes.join(',')} onChange=${(e) => setShots([...shots, ...e.target.files].slice(0, ai.limits.images.maxCount))} />`}
      </div>
    </div>`}
    <div class="sources">
      <${SourceCard} icon="smartphone" tone="tier-3" title="iPhone contacts" steps=${['Open Contacts and tap Lists (top left).', 'Touch and hold All Contacts (or any list), then tap Export.', 'Save to Files, then upload the .vcf here.']}>
        <button class="btn primary sm" onClick=${() => choose('phone')}><${Icon} n="upload" cls="sm" />Upload .vcf</button><//>
      <${SourceCard} icon="smartphone" tone="tier-4" title="Android / Google" steps=${['Go to contacts.google.com.', 'Click Export, choose vCard or Google CSV.', 'Upload the file here.']} link=${['https://contacts.google.com', 'Open Google Contacts']}>
        <button class="btn primary sm" onClick=${() => choose('phone')}><${Icon} n="upload" cls="sm" />Upload file</button><//>
      <${SourceCard} icon="linkedin" tone="tier-3" title="LinkedIn" steps=${['Settings → Data privacy → Get a copy of your data.', 'Pick only Connections and request the archive.', 'LinkedIn emails it in about 10 minutes. Upload Connections.csv.']} link=${['https://www.linkedin.com/mypreferences/d/download-my-data', 'Open LinkedIn export']}>
        <button class="btn primary sm" onClick=${() => choose('linkedin')}><${Icon} n="upload" cls="sm" />Upload Connections.csv</button><//>
      <${SourceCard} icon="notion" tone="tier-1" title="Notion" steps=${['Open your Personal CRM database as a full page.', '••• menu → Export → Markdown & CSV.', 'Unzip and upload the .csv (the one ending in _all has every row).']}>
        <button class="btn primary sm" onClick=${() => choose('notion')}><${Icon} n="upload" cls="sm" />Upload .csv</button><//>
      <${SourceCard} icon="table" tone="tier-2" title="Any spreadsheet" steps=${['Export from Excel, Google Sheets, Airtable or another CRM as CSV.', 'Upload it; you can check how each column is read.']}>
        <button class="btn primary sm" onClick=${() => choose('csv')}><${Icon} n="upload" cls="sm" />Upload .csv</button><//>
      <${SourceCard} icon="file" tone="tier-4" title="Restore a backup" steps=${['Use a .json file from Settings → Export backup.', 'Everyone is merged by ID, so nothing duplicates.']}>
        <button class="btn sm" onClick=${() => choose('backup')}><${Icon} n="upload" cls="sm" />Upload .json</button><//>
    </div>
  </div>`;
}

/* =========================================================
   Settings
   ========================================================= */
function SettingsView({ contacts, settings, store, toast, exportJSON, exportCSV }) {
  const [tiers, setTiers] = useState(settings.tiers);
  const [confirm, setConfirm] = useState('');
  const [busy, setBusy] = useState(false);
  useEffect(() => setTiers(settings.tiers), [settings]);
  const changed = JSON.stringify(tiers) !== JSON.stringify(settings.tiers);
  const saveTiers = async () => { await store.saveSettings({ ...settings, tiers }); toast('Circles saved'); };
  const applyCadence = async (i) => {
    const list = contacts.filter((c) => c.tier === i + 1 && c.cadence !== tiers[i].cadence).map((c) => ({ ...c, cadence: tiers[i].cadence, updatedAt: nowStamp() }));
    if (!list.length) { toast('Everyone in that circle already has that reminder'); return; }
    setBusy(true); await store.putMany(list); setBusy(false);
    toast(`Updated ${plural(list.length, 'person')}`);
  };
  const wipe = async () => { setBusy(true); await store.removeMany(contacts.map((c) => c.id)); setBusy(false); setConfirm(''); toast('All people deleted'); };
  return html`<div class="page">
    <div class="page-h"><div><h1>Settings</h1><p>Circles, reminders and backups.</p></div></div>
    <div class="set-grid">
      <div class="panel" style="display:flex;flex-direction:column;gap:14px">
        <div class="panel-h" style="margin:0"><h2>Circles</h2></div>
        <p class="muted" style="margin:0">Name your four circles and pick how often you want to be nudged about the people in each. New people use these defaults.</p>
        ${tiers.map((t, i) => html`<div class="tier-edit">
          <span class=${'pill tier-' + (i + 1)}>${i + 1}</span>
          <input class="input" value=${t.label} aria-label=${`Circle ${i + 1} name`} onInput=${(e) => setTiers(tiers.map((x, j) => (j === i ? { ...x, label: e.target.value } : x)))} />
          <div style="display:flex;gap:6px">
            <select class="select" aria-label=${`Circle ${i + 1} reminder`} value=${t.cadence || ''} onChange=${(e) => setTiers(tiers.map((x, j) => (j === i ? { ...x, cadence: e.target.value ? +e.target.value : null } : x)))}>
              <option value="">No reminder</option>${CADENCES.map(([n, l]) => html`<option value=${n}>${l}</option>`)}</select>
            <button class="btn sm ghost" disabled=${busy || changed} title=${changed ? 'Save first' : 'Use this reminder for everyone already in this circle'} onClick=${() => applyCadence(i)}>Apply to all</button>
          </div>
        </div>`)}
        <div><button class="btn primary" disabled=${!changed} onClick=${saveTiers}>Save circles</button></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:20px">
        <div class="panel" style="display:flex;flex-direction:column;gap:12px">
          <div class="panel-h" style="margin:0"><h2>Where your data lives</h2></div>
          ${store.mode === 'cloud'
            ? html`<p style="margin:0"><span class="dot" style="display:inline-block;margin-right:8px"></span>Synced to your Claude account. Open this page on your phone or laptop and you'll see the same people.</p>`
            : html`<p style="margin:0"><span class="dot warn" style="display:inline-block;margin-right:8px"></span>Saved in this browser only${store.reason === 'signed-out' ? ' because you are signed out' : ''}. Export a backup now and then so you never lose it.</p>`}
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn" onClick=${exportJSON}><${Icon} n="download" cls="sm" />Export backup (.json)</button>
            <button class="btn" onClick=${exportCSV}><${Icon} n="table" cls="sm" />Export spreadsheet (.csv)</button>
          </div>
        </div>
        <div class="panel" style="display:flex;flex-direction:column;gap:12px">
          <div class="panel-h" style="margin:0"><h2>Shortcuts</h2></div>
          <div class="kv" style="grid-template-columns:auto minmax(0,1fr)">
            <dt><span class="kbd">⌘ K</span> or <span class="kbd">/</span></dt><dd>Search anyone, jump anywhere</dd>
            <dt><span class="kbd">N</span></dt><dd>Add a person</dd>
            <dt><span class="kbd">Esc</span></dt><dd>Close what's open</dd>
          </div>
        </div>
        <div class="panel" style="display:flex;flex-direction:column;gap:10px">
          <div class="panel-h" style="margin:0"><h2>Start over</h2></div>
          <p class="muted" style="margin:0">Deletes all ${plural(contacts.length, 'person')}. Export a backup first. Type <b>DELETE</b> to confirm.</p>
          <div style="display:flex;gap:8px"><input class="input" value=${confirm} onInput=${(e) => setConfirm(e.target.value)} placeholder="DELETE" aria-label="Type DELETE to confirm" />
            <button class="btn danger armed" disabled=${confirm !== 'DELETE' || busy || !contacts.length} onClick=${wipe}>Delete everyone</button></div>
        </div>
      </div>
    </div>
  </div>`;
}

/* =========================================================
   App
   ========================================================= */
const ROUTES = [['today', 'Today', 'sun'], ['people', 'People', 'users'], ['network', 'Network', 'orbit'], ['import', 'Import', 'upload']];
const routeFromHash = () => { const r = (location.hash || '').slice(1); return ['today', 'people', 'network', 'import', 'settings'].includes(r) ? r : 'today'; };

function toCSV(contacts, settings) {
  const cols = [['Name', 'name'], ['Circle', (c) => settings.tiers[c.tier - 1].label], ['Company', 'company'], ['Role', 'role'], ['Location', 'location'], ['Country', 'country'],
    ['How we met', 'howWeMet'], ['Email', 'email'], ['Phone', 'phone'], ['LinkedIn', 'linkedin'], ['Birthday', 'birthday'], ['Tags', (c) => (c.tags || []).join(', ')],
    ['Reminder', (c) => cadenceLabel(c.cadence)], ['Last contacted', 'lastContacted'], ['Notes', 'notes']];
  const esc = (v) => { const s = String(v == null ? '' : v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return [cols.map((c) => c[0]).join(','), ...contacts.map((c) => cols.map(([, k]) => esc(typeof k === 'function' ? k(c) : c[k])).join(','))].join('\r\n');
}

function App() {
  const [store, setStore] = useState(null);
  const [data, setData] = useState({ contacts: [], settings: null, ready: false, error: null });
  const [route, setRoute] = useState(routeFromHash());
  const [openId, setOpenId] = useState(null);
  const [draft, setDraft] = useState(null);
  const [palette, setPalette] = useState(false);
  const [toasts, setToasts] = useState([]);
  const [ai, setAi] = useState(null);
  const [prefs, setPrefsState] = useState(() => ({ filters: EMPTY_FILTERS, ...loadPrefs() }));
  const chains = useRef(new Map());

  useEffect(() => {
    let unsub = null, alive = true;
    pickStore().then((s) => { if (!alive) return; setStore(s); unsub = s.subscribe(setData); });
    claudeUse('sample').then(async (s) => { if (!s) return; const limits = await s.limits().catch(() => null); setAi({ sample: s, limits }); });
    const onHash = () => setRoute(routeFromHash());
    window.addEventListener('hashchange', onHash);
    return () => { alive = false; unsub && unsub(); window.removeEventListener('hashchange', onHash); };
  }, []);

  const setPrefs = (patch) => setPrefsState((p) => { const n = { ...p, ...patch }; savePrefs(n); return n; });
  const filters = useMemo(() => ({ ...EMPTY_FILTERS, ...(prefs.filters || {}) }), [prefs.filters]);
  const setFilters = (f) => setPrefs({ filters: f });
  const settings = useMemo(() => mergeSettings(data.settings), [data.settings]);
  const contacts = useMemo(() => data.contacts.map(normalizeContact).filter((c) => c.name), [data.contacts]);
  const byId = useMemo(() => new Map(contacts.map((c) => [c.id, c])), [contacts]);
  const hay = useMemo(() => new Map(contacts.map((c) => [c.id, haystack(c)])), [contacts]);
  const allTags = useMemo(() => countBy(contacts, (c) => c.tags).map((x) => x.value), [contacts]);
  const dueCount = useMemo(() => { const t = todayISO(); return contacts.filter((c) => { const k = statusOf(c, t).key; return k === 'overdue'; }).length; }, [contacts]);

  const toast = useCallback((msg, opts = {}) => {
    const id = uid('t');
    setToasts((ts) => [...ts.slice(-2), { id, msg, undo: opts.undo }]);
    setTimeout(() => setToasts((ts) => ts.filter((x) => x.id !== id)), opts.undo ? 6000 : 3000);
  }, []);

  const save = useCallback((c) => {
    const prev = chains.current.get(c.id) || Promise.resolve();
    const p = prev.catch(() => {}).then(() => store.put(c)).catch((e) => {
      toast(e && e.code === 'quota_exceeded' ? 'Storage is full. Export a backup and remove some people.' : e && e.code === 'local_full' ? e.message : "Couldn't save. Check your connection and try again.");
    });
    chains.current.set(c.id, p);
    return p;
  }, [store]);

  const act = {
    logTouch: (c, i) => {
      const last = !c.lastContacted || i.date > c.lastContacted ? i.date : c.lastContacted;
      const prev = c;
      save({ ...c, interactions: [...(c.interactions || []), i], lastContacted: last, snoozeUntil: '', updatedAt: nowStamp() });
      toast(`Logged ${touchMeta(i.type)[1].toLowerCase()} with ${c.name.split(' ')[0]}`, { undo: () => save(prev) });
    },
    snooze: (c, days) => {
      const prev = c;
      save({ ...c, snoozeUntil: addDays(todayISO(), days), updatedAt: nowStamp() });
      toast(`Snoozed ${c.name.split(' ')[0]} for ${plural(days, 'day')}`, { undo: () => save(prev) });
    },
    setLast: (c, iso) => {
      const prev = c;
      save({ ...c, lastContacted: iso, updatedAt: nowStamp() });
      toast(`Got it. ${c.name.split(' ')[0]}'s clock has started.`, { undo: () => save(prev) });
    },
  };
  const go = (r) => { setOpenId(null); setDraft(null); if (location.hash.slice(1) !== r) location.hash = r; setRoute(r); window.scrollTo({ top: 0 }); };
  const drill = (patch) => { setFilters({ ...EMPTY_FILTERS, ...patch }); go('people'); };
  const openPerson = (id) => { setDraft(null); setOpenId(id); };
  const addPerson = () => { setOpenId(null); setDraft(blankContact(settings)); };
  const remove = async (c) => {
    setOpenId(null); setDraft(null);
    try { await store.remove(c.id); toast(`Deleted ${c.name}`, { undo: () => save(c) }); }
    catch (e) { toast("Couldn't delete. Try again."); }
  };
  const exportJSON = async () => {
    const body = JSON.stringify({ app: 'myvillage', version: 1, exportedAt: nowStamp(), settings, contacts }, null, 2);
    try { const r = await saveFile(`myvillage-backup-${todayISO()}.json`, body, 'application/json'); if (r === 'saved') toast('Backup saved'); }
    catch (e) { toast('Could not save the file here.'); }
  };
  const exportCSV = async () => {
    try { const r = await saveFile(`myvillage-${todayISO()}.csv`, toCSV(contacts, settings), 'text/csv'); if (r === 'saved') toast('Spreadsheet saved'); }
    catch (e) { toast('Could not save the file here.'); }
  };

  useLayoutEffect(() => {
    const k = (e) => {
      const tag = (e.target.tagName || '').toLowerCase();
      const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setPalette((p) => !p); return; }
      if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === '/') { e.preventDefault(); setPalette(true); }
      else if (e.key === 'n' && !document.querySelector('.sheet, .modal')) { e.preventDefault(); addPerson(); }
    };
    document.addEventListener('keydown', k);
    return () => document.removeEventListener('keydown', k);
  });

  if (!store || !data.ready) {
    return html`<div class="skeleton"><div style="display:flex;flex-direction:column;align-items:center;gap:12px"><div class="mark" style="width:48px;height:48px;font-size:28px">V</div><div>Opening your village…</div></div></div>`;
  }

  const open = openId ? byId.get(openId) : null;
  const navCount = dueCount > 0 ? dueCount : null;
  const view = {
    today: html`<${TodayView} contacts=${contacts} settings=${settings} act=${act} onOpen=${openPerson} go=${go} onAdd=${addPerson} />`,
    people: html`<${PeopleView} contacts=${contacts} settings=${settings} filters=${filters} setFilters=${setFilters} prefs=${prefs} setPrefs=${setPrefs} hay=${hay} onOpen=${openPerson} onAdd=${addPerson} onExport=${exportCSV} />`,
    network: html`<${NetworkView} contacts=${contacts} settings=${settings} onOpen=${openPerson} drill=${drill} prefs=${prefs} setPrefs=${setPrefs} />`,
    import: html`<${ImportView} contacts=${contacts} settings=${settings} store=${store} ai=${ai} toast=${toast} go=${go} drill=${drill} />`,
    settings: html`<${SettingsView} contacts=${contacts} settings=${settings} store=${store} toast=${toast} exportJSON=${exportJSON} exportCSV=${exportCSV} />`,
  }[route];

  return html`<div class="shell">
    <nav class="rail" aria-label="Main">
      <div class="brand"><div class="mark">V</div><div class="wordmark">My<span>Village</span></div></div>
      ${ROUTES.map(([k, l, ic]) => html`<button class="nav-btn" aria-current=${route === k ? 'page' : null} onClick=${() => go(k)}><${Icon} n=${ic} />${l}${k === 'today' && navCount ? html`<span class="count num">${navCount}</span>` : null}</button>`)}
      <button class="nav-btn" aria-current=${route === 'settings' ? 'page' : null} onClick=${() => go('settings')}><${Icon} n="sliders" />Settings</button>
      <div class="rail-foot">
        <button class="btn primary block" onClick=${addPerson}><${Icon} n="plus" cls="sm" />Add person</button>
        <button class="btn block" onClick=${() => setPalette(true)}><${Icon} n="search" cls="sm" />Search<span class="kbd" style="margin-left:auto">⌘K</span></button>
        <div class="sync"><span class=${'dot' + (store.mode === 'cloud' ? '' : ' warn')}></span>${store.mode === 'cloud' ? 'Synced to your account' : 'Saved in this browser'}</div>
      </div>
    </nav>
    <header class="topbar">
      <div class="brand"><div class="mark">V</div><div class="wordmark">My<span>Village</span></div></div>
      <button class="btn icon ghost" aria-label="Search" onClick=${() => setPalette(true)}><${Icon} n="search" /></button>
      <button class="btn icon ghost" aria-label="Settings" onClick=${() => go('settings')}><${Icon} n="sliders" /></button>
    </header>
    <main class="main">
      ${store.mode === 'local' && store.reason === 'signed-out' && html`<div class="banner" style="max-width:1180px;margin:0 auto 18px"><span class="grow">You're viewing without signing in, so changes stay in this browser only.</span></div>`}
      ${data.error && html`<div class="banner" style="max-width:1180px;margin:0 auto 18px"><span class="grow">Your people couldn't load. Reload the page to try again.</span></div>`}
      ${view}
    </main>
    <nav class="tabbar" aria-label="Main">
      ${ROUTES.map(([k, l, ic]) => html`<button class="tab" aria-current=${route === k ? 'page' : null} onClick=${() => go(k)}><${Icon} n=${ic} cls="lg" />${l}${k === 'today' && navCount ? html`<span class="count num">${navCount}</span>` : null}</button>`)}
    </nav>
    ${route !== 'import' && route !== 'settings' && !open && !draft && html`<button class="fab" aria-label="Add person" onClick=${addPerson}><${Icon} n="plus" /></button>`}
    ${(open || draft) && html`<${PersonSheet} key=${(open || draft).id} contact=${open || byId.get(draft.id) || draft} isNew=${!!draft && !byId.has(draft.id)}
      settings=${settings} allTags=${allTags} act=${act} toast=${toast}
      onSave=${save} onDelete=${remove} onClose=${() => { setOpenId(null); setDraft(null); }} />`}
    ${palette && html`<${Palette} contacts=${contacts} hay=${hay} onClose=${() => setPalette(false)} onOpen=${openPerson} go=${go} onAdd=${addPerson} />`}
    <div class="toasts" aria-live="polite">${toasts.map((t) => html`<div class="toast" key=${t.id}><span class="grow">${t.msg}</span>
      ${t.undo && html`<button onClick=${() => { t.undo(); setToasts((ts) => ts.filter((x) => x.id !== t.id)); }}>Undo</button>`}</div>`)}</div>
  </div>`;
}

window.__myvillage = { parseCSV, parseVCF, guessField, recordFromRow, findHeaderRow, statusOf, makeMatcher, mergeContact, parseBirthday, nextBirthday, parseTier, splitTags };
render(html`<${App} />`, document.getElementById('app'));
})();
</script>
