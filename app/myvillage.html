<title>MyVillage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app shell. Left rail on desktop, top bar + bottom tab bar on phones.
   One content column (max 1180px). A person opens in a sheet that slides over from the right (full screen on phones). */
:root {
  --bg: #EEF5F3;
  --surface: #FFFFFF;
  --surface-2: #E4EFEC;
  --line: #D2E2DE;
  --ink: #0D2523;
  --ink-2: #46625E;
  --ink-3: #7B9591;
  --accent: #1E9A8C;
  --accent-strong: #11695F;
  --accent-soft: #D2EDE8;
  --on-accent: #FFFFFF;
  --gold: #D99A0B;
  --gold-soft: #FBEFCF;
  --rose: #C9476F;
  --rose-soft: #F9E0E8;
  --sky: #2F78BE;
  --sky-soft: #DCEAF7;
  --coral: #D9533F;
  --coral-soft: #FBE2DC;
  --amber: #D5791A;
  --amber-soft: #FBE9D4;
  --ok: #24935A;
  --ok-soft: #DBF1E4;
  --neutral-soft: #E7EEED;
  --scrim: rgb(9 28 26 / .38);
  --av-s: 46%;
  --av-l: 85%;
  --av-ink: 24%;
  --shadow-1: 0 1px 2px rgb(13 37 35 / .06), 0 2px 8px -4px rgb(13 37 35 / .12);
  --shadow-2: 0 2px 6px rgb(13 37 35 / .08), 0 22px 48px -20px rgb(13 37 35 / .35);
  --f-display: 'Bricolage Grotesque', 'Avenir Next', ui-sans-serif, system-ui, sans-serif;
  --f-body: 'Instrument Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 18px;
  --rail: 232px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1615; --surface: #12201E; --surface-2: #192B29; --line: #243C39;
    --ink: #E3F0ED; --ink-2: #A2BBB7; --ink-3: #6D8985;
    --accent: #3CC4B2; --accent-strong: #7DDCCF; --accent-soft: #15403A; --on-accent: #04201C;
    --gold: #F0BC45; --gold-soft: #3A2D0E; --rose: #EE7FA0; --rose-soft: #3E1A27;
    --sky: #6FAEEA; --sky-soft: #142B42; --coral: #F27F6B; --coral-soft: #3F1C16;
    --amber: #F0A04E; --amber-soft: #3B2711; --ok: #52C98A; --ok-soft: #12321F; --neutral-soft: #1C2E2C;
    --scrim: rgb(0 0 0 / .55);
    --av-s: 34%; --av-l: 27%; --av-ink: 86%;
    --shadow-1: 0 1px 2px rgb(0 0 0 / .3);
    --shadow-2: 0 2px 6px rgb(0 0 0 / .3), 0 24px 48px -16px rgb(0 0 0 / .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1615; --surface: #12201E; --surface-2: #192B29; --line: #243C39;
  --ink: #E3F0ED; --ink-2: #A2BBB7; --ink-3: #6D8985;
  --accent: #3CC4B2; --accent-strong: #7DDCCF; --accent-soft: #15403A; --on-accent: #04201C;
  --gold: #F0BC45; --gold-soft: #3A2D0E; --rose: #EE7FA0; --rose-soft: #3E1A27;
  --sky: #6FAEEA; --sky-soft: #142B42; --coral: #F27F6B; --coral-soft: #3F1C16;
  --amber: #F0A04E; --amber-soft: #3B2711; --ok: #52C98A; --ok-soft: #12321F; --neutral-soft: #1C2E2C;
  --scrim: rgb(0 0 0 / .55);
  --av-s: 34%; --av-l: 27%; --av-ink: 86%;
  --shadow-1: 0 1px 2px rgb(0 0 0 / .3);
  --shadow-2: 0 2px 6px rgb(0 0 0 / .3), 0 24px 48px -16px rgb(0 0 0 / .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--f-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
a { color: var(--accent-strong); }
.mono { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 15px; height: 15px; }
svg.i.lg { width: 22px; height: 22px; }

/* ---------- shell ---------- */
.shell { min-height: 100%; display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); }
.rail {
  position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; height: 100dvh;
  display: flex; flex-direction: column; gap: 4px; padding: 22px 14px;
  border-right: 1px solid var(--line); background: var(--surface);
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; }
.mark {
  width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; flex: none;
  background: var(--accent); color: var(--on-accent);
  font: 800 22px/1 var(--f-display); letter-spacing: -0.04em; transform: rotate(-4deg);
}
.wordmark { font: 700 21px/1 var(--f-display); letter-spacing: -0.02em; }
.wordmark span { color: var(--accent); }
.nav-btn {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px;
  border: 0; border-radius: var(--r-md); background: none; color: var(--ink-2); font-weight: 500; text-align: left;
}
.nav-btn:hover { background: var(--surface-2); color: var(--ink); }
.nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
.nav-btn .count { margin-left: auto; font-size: 12px; font-weight: 700; background: var(--coral); color: var(--on-accent); border-radius: 99px; padding: 1px 7px; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.kbd { font: 500 11px/1 var(--f-mono); padding: 3px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; color: var(--ink-3); }
.sync { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-3); padding: 0 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.dot.warn { background: var(--amber); }

.main { min-width: 0; padding: 28px 32px 64px; }
.page { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.topbar, .tabbar { display: none; }

@media (max-width: 899px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .topbar {
    display: flex; align-items: center; gap: 8px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    padding: 10px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
  }
  .topbar .brand { padding: 0; margin-right: auto; }
  .topbar .mark { width: 30px; height: 30px; font-size: 18px; border-radius: 9px; }
  .topbar .wordmark { font-size: 18px; }
  .main { padding: 18px 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
  .tabbar {
    display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; z-index: 30; left: 0; right: 0; bottom: 0;
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line);
  }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border: 0; background: none; color: var(--ink-3); font-size: 11px; font-weight: 600; position: relative; }
  .tab[aria-current="page"] { color: var(--accent-strong); }
  .tab .count { position: absolute; top: 0; left: calc(50% + 6px); font-size: 10px; background: var(--coral); color: var(--on-accent); border-radius: 99px; padding: 0 5px; }
}

/* ---------- buttons, inputs ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 8px 14px;
  border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-weight: 600; font-size: 14px; white-space: nowrap; transition: background .15s, border-color .15s, transform .1s;
}
.btn:hover { border-color: var(--ink-3); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn.ghost { border-color: transparent; background: none; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.danger { color: var(--coral); }
.btn.danger.armed { background: var(--coral); color: var(--on-accent); border-color: var(--coral); }
.btn.sm { min-height: 32px; padding: 5px 10px; font-size: 13px; border-radius: 10px; }
.btn.icon { padding: 0; width: 38px; }
.btn.icon.sm { width: 32px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.btn.block { width: 100%; }

.input, .select, .textarea {
  width: 100%; min-height: 40px; padding: 8px 12px; border-radius: var(--r-md);
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); outline: none;
}
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.textarea { resize: vertical; min-height: 110px; line-height: 1.55; }
.select { appearance: none; padding-right: 32px; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.search { position: relative; flex: 1 1 260px; min-width: 0; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.search .input { padding-left: 38px; padding-right: 36px; min-height: 44px; font-size: 15px; }
.search .clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); }

/* ---------- pills, chips, avatars ---------- */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: 12.5px; font-weight: 600; white-space: nowrap; line-height: 1.6; }
.tier-1 { background: var(--gold-soft); color: var(--gold); }
.tier-2 { background: var(--rose-soft); color: var(--rose); }
.tier-3 { background: var(--sky-soft); color: var(--sky); }
.tier-4 { background: var(--neutral-soft); color: var(--ink-2); }
.tier-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.st-overdue { background: var(--coral-soft); color: var(--coral); }
.st-unknown { background: var(--amber-soft); color: var(--amber); }
.st-soon { background: var(--amber-soft); color: var(--amber); }
.st-ok { background: var(--ok-soft); color: var(--ok); }
.st-snoozed { background: var(--sky-soft); color: var(--sky); }
.st-none { background: var(--neutral-soft); color: var(--ink-3); }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.tag button { border: 0; background: none; padding: 0; color: var(--ink-3); display: inline-flex; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.av {
  --size: 40px; width: var(--size); height: var(--size); border-radius: 50%; flex: none; display: grid; place-items: center;
  background: hsl(var(--h) var(--av-s) var(--av-l)); color: hsl(var(--h) 50% var(--av-ink));
  font: 700 calc(var(--size) * .38)/1 var(--f-display); letter-spacing: -0.02em; position: relative; user-select: none;
}
.av .fav { position: absolute; right: -3px; bottom: -3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; color: var(--gold); }
.av .fav svg { width: 11px; height: 11px; fill: currentColor; stroke: none; }

/* ---------- cards / panels ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; min-width: 0; }
.panel-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.panel-h h2 { font-size: 18px; }
.page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-h h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
.page-h p { margin: 6px 0 0; color: var(--ink-2); }
.empty { text-align: center; padding: 36px 16px; color: var(--ink-2); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty h3 { font-size: 20px; color: var(--ink); }

/* ---------- today ---------- */
.today-grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.today-side { display: flex; flex-direction: column; gap: 20px; }
@media (max-width: 1000px) { .today-grid { grid-template-columns: minmax(0, 1fr); } }
.hero-line { font: 800 clamp(30px, 5vw, 48px)/1.02 var(--f-display); letter-spacing: -0.035em; }
.hero-line em { font-style: normal; color: var(--accent); }
.queue { display: flex; flex-direction: column; }
.qrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 4px; border-top: 1px solid var(--line); }
.qrow:first-child { border-top: 0; }
.qmain { min-width: 0; cursor: pointer; }
.qname { font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.qsub { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qacts { display: flex; gap: 6px; align-items: center; }
.qextra { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--ink-2); }
@media (max-width: 560px) {
  .qrow { grid-template-columns: auto minmax(0, 1fr); }
  .qacts { grid-column: 2; }
}
.health { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; }
.ring-num { font: 800 26px/1 var(--f-display); }
.tier-bars { display: flex; flex-direction: column; gap: 9px; }
.tbar { display: grid; grid-template-columns: 96px minmax(0, 1fr) 46px; gap: 8px; align-items: center; font-size: 13px; }
.tbar .track { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.tbar .fill { height: 100%; border-radius: 99px; background: var(--ok); }
.mini-list { display: flex; flex-direction: column; gap: 2px; }
.mini { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-radius: var(--r-md); border: 0; background: none; text-align: left; width: 100%; }
.mini:hover { background: var(--surface-2); }
.mini .grow { flex: 1; min-width: 0; }
.mini .t { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini .s { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* log-touch composer */
.composer { grid-column: 1 / -1; background: var(--surface-2); border-radius: var(--r-md); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 11px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.composer-row { display: flex; gap: 8px; flex-wrap: wrap; }
.composer-row .input { flex: 1 1 180px; }
.composer-row input[type="date"] { flex: 0 0 160px; }

/* ---------- people ---------- */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toggle { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); padding: 3px; gap: 2px; }
.toggle button { border: 0; background: none; border-radius: 9px; padding: 6px 9px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
.toggle button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-strong); }
.filterbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.fchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.fchip:hover { border-color: var(--ink-3); }
.fchip.on { background: var(--accent-soft); border-color: transparent; color: var(--accent-strong); }
.fchip .c { font-weight: 500; color: var(--ink-3); }
.fchip.on .c { color: inherit; opacity: .75; }
.pop-wrap { position: relative; }
.pop {
  position: absolute; z-index: 40; top: calc(100% + 6px); left: 0; width: 270px; max-width: calc(100vw - 32px);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow-2); padding: 8px;
  display: flex; flex-direction: column; gap: 6px;
}
.pop.right { left: auto; right: 0; }
.pop-list { max-height: 280px; overflow: auto; display: flex; flex-direction: column; }
.opt { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; border: 0; background: none; text-align: left; font-size: 14px; width: 100%; }
.opt:hover, .opt.active { background: var(--surface-2); }
.opt .c { margin-left: auto; color: var(--ink-3); font-size: 12px; }
.check { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--ink-3); display: grid; place-items: center; flex: none; }
.check.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.check svg { width: 12px; height: 12px; stroke-width: 3; }
.resultbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink-2); }
.group-h { display: flex; align-items: baseline; gap: 10px; margin: 8px 2px 10px; }
.group-h h3 { font-size: 17px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.pcard {
  display: flex; flex-direction: column; gap: 12px; padding: 16px; text-align: left; border-radius: var(--r-lg);
  border: 1px solid var(--line); background: var(--surface); transition: border-color .15s, box-shadow .15s, transform .15s; min-width: 0;
}
.pcard:hover { border-color: var(--accent); box-shadow: var(--shadow-1); transform: translateY(-1px); }
.pcard-top { display: flex; gap: 12px; align-items: center; min-width: 0; }
.pcard-name { font: 700 16.5px/1.2 var(--f-display); letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pcard-sub { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pcard-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pcard-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-3); margin-top: auto; }
.lrows { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.lrow { display: grid; grid-template-columns: auto minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 14px; border: 0; border-top: 1px solid var(--line); background: none; width: 100%; text-align: left; }
.lrow:first-child { border-top: 0; }
.lrow:hover { background: var(--surface-2); }
.lrow .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .s { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 640px) { .lrow { grid-template-columns: auto minmax(0, 1fr) auto; } .lrow .hide-sm { display: none; } }
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
table.grid { border-collapse: collapse; width: 100%; font-size: 13.5px; min-width: 980px; }
table.grid th { text-align: left; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: var(--surface); }
table.grid th button { border: 0; background: none; padding: 0; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; display: inline-flex; gap: 4px; align-items: center; }

const LS_KEY = 'myvillage:data:v1';
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }

const plain = (o) => JSON.parse(JSON.stringify(o));

function makeLocalStore(reason) {
  let state = lsGet(LS_KEY, null) || { contacts: {}, settings: null };
  const subs = new Set();
  const snap = () => ({ contacts: Object.values(state.contacts), settings: state.settings, ready: true, error: null });
  const emit = () => { const s = snap(); subs.forEach((f) => f(s)); };
  const persist = () => { if (!lsSet(LS_KEY, state)) throw { code: 'local_full', message: 'This browser refused to save. Export a backup.' }; };
  return {
    mode: 'local', reason,
    subscribe(f) { subs.add(f); f(snap()); return () => subs.delete(f); },
    async put(c) { state.contacts[c.id] = plain(c); persist(); emit(); },
    async remove(id) { delete state.contacts[id]; persist(); emit(); },
    async putMany(list, onProgress) { list.forEach((c) => { state.contacts[c.id] = plain(c); }); persist(); emit(); onProgress && onProgress(list.length); },
    async removeMany(ids) { ids.forEach((id) => delete state.contacts[id]); persist(); emit(); },
    async saveSettings(s) { state.settings = plain(s); persist(); emit(); },
  };
}

function makeCloudStore(db) {
  const col = db.collection('contacts');
  const sdoc = db.doc('meta/settings');
  let contacts = [], settings = null, gotC = false, gotS = false, error = null;
  const subs = new Set();
  const snap = () => ({ contacts, settings, ready: gotC && gotS, error });
  const emit = () => { const s = snap(); subs.forEach((f) => f(s)); };
  col.onSnapshot((s) => { contacts = s.docs.map((d) => ({ ...d.data(), id: d.id })); gotC = true; emit(); },
    (e) => { error = e; gotC = true; emit(); });
  sdoc.onSnapshot((s) => { settings = s.exists ? s.data() : null; gotS = true; emit(); },
    () => { gotS = true; emit(); });
  async function retry(fn) {
    for (let i = 0; ; i++) {
      try { return await fn(); } catch (e) {
        const code = e && e.code;
        if (i < 5 && (code === 'resource_exhausted' || code === 'unavailable')) { await sleep(500 * 2 ** i + Math.random() * 400); continue; }
        throw e;
      }
    }
  }
  const write = (c) => { const body = plain(c); return retry(() => col.doc(c.id).set(body)); };
  async function pool(items, fn, onProgress) {
    let done = 0; const q = items.slice();
    const worker = async () => { while (q.length) { const it = q.shift(); await fn(it); done++; onProgress && onProgress(done); } };
    await Promise.all([worker(), worker(), worker()]);
  }
  return {
    mode: 'cloud',
    subscribe(f) { subs.add(f); f(snap()); return () => subs.delete(f); },
    put: write,
    remove: (id) => retry(() => col.doc(id).delete()),
    putMany: (list, onProgress) => pool(list, write, onProgress),
    removeMany: (ids, onProgress) => pool(ids, (id) => retry(() => col.doc(id).delete()), onProgress),
    saveSettings: (s) => retry(() => sdoc.set(plain(s))),
  };
}

async function pickStore() {
  if (!(window.claude && typeof window.claude.use === 'function')) return makeLocalStore('standalone');
  const db = await claudeUse('db');
  return db ? makeCloudStore(db) : makeLocalStore('signed-out');
}

async function saveFile(filename, data, mime) {

  if (dl) {
    try { const r = await dl.save({ filename, data }); return r.status; }
    catch (e) { if (e && e.code === 'declined') return 'declined'; throw e; }
  }
  const url = URL.createObjectURL(new Blob([data], { type: mime }));
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  return 'saved';
}

function TierPill({ tier, settings, short }) {
  const t = settings.tiers[tier - 1] || {};

function StatusPill({ s, short }) {

const subline = (c) => [c.role, c.company].filter(Boolean).join(' · ') || c.howWeMet || c.email || '';

function useOutside(ref, onOut, active) {
  useEffect(() => {
    if (!active) return;
    const fn = (e) => { if (ref.current && !ref.current.contains(e.target)) onOut(); };
    const key = (e) => { if (e.key === 'Escape') onOut(); };
    document.addEventListener('pointerdown', fn); document.addEventListener('keydown', key);
    return () => { document.removeEventListener('pointerdown', fn); document.removeEventListener('keydown', key); };
  }, [active]);
}

function MultiSelect({ label, icon, options, selected, onChange, right }) {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState('');
  const ref = useRef();
  useOutside(ref, () => setOpen(false), open);
  useEffect(() => { if (open && window.matchMedia('(pointer:fine)').matches) { const el = ref.current && ref.current.querySelector('.pop input'); el && el.focus(); } }, [open]);
  const shown = options.filter((o) => !q || norm(o.value).includes(norm(q)));
  const toggle = (v) => onChange(selected.includes(v) ? selected.filter((x) => x !== v) : [...selected, v]);
  const text = selected.length === 0 ? label : selected.length === 1 ? selected[0] : `${label} · ${selected.length}`;
  return html`<div class="pop-wrap" ref=${ref}>
    <button class=${'fchip' + (selected.length ? ' on' : '')} onClick=${() => setOpen(!open)} aria-expanded=${open}>
      ${icon ? html`<${Icon} n=${icon} cls="sm" />` : null}${text}<${Icon} n="chev" cls="sm" />
    </button>
    ${open && html`<div class=${'pop' + (right ? ' right' : '')}>
      ${options.length > 8 && html`<input class="input" placeholder=${'Find ' + label.toLowerCase()} value=${q} onInput=${(e) => setQ(e.target.value)} />`}
      <div class="pop-list">
        ${shown.length === 0 && html`<div class="faint" style="padding:8px">Nothing here yet.</div>`}
        ${shown.map((o) => html`<button class="opt" onClick=${() => toggle(o.value)}>
          <span class=${'check' + (selected.includes(o.value) ? ' on' : '')}>${selected.includes(o.value) && html`<${Icon} n="check" />`}</span>
          <span>${o.value}</span><span class="c num">${o.count}</span>
        </button>`)}
      </div>
      ${selected.length > 0 && html`<button class="btn sm ghost" onClick=${() => onChange([])}>Clear</button>`}
    </div>`}
  </div>`;
}

function Menu({ trigger, items, right }) {
  const [open, setOpen] = useState(false);

function TagInput({ value, onChange, allTags, placeholder = 'Add a tag' }) {
  const [q, setQ] = useState('');
  const [focus, setFocus] = useState(false);
  const add = (t) => { t = cleanTag(t); if (!t) return; onChange(uniqTags([...value, t])); setQ(''); };
  const sugg = allTags.filter((t) => !value.some((v) => norm(v) === norm(t)) && (!q || norm(t).includes(norm(q)))).slice(0, 8);
  return html`<div class="tagbox">
    ${value.map((t) => html`<span class="tag">${t}<button aria-label=${'Remove ' + t} onClick=${() => onChange(value.filter((x) => x !== t))}><${Icon} n="x" cls="sm" /></button></span>`)}
    <input value=${q} placeholder=${value.length ? '' : placeholder} aria-label="Add a tag"
      onInput=${(e) => { const v = e.target.value; if (/[,\n]/.test(v)) { v.split(/[,\n]/).forEach(add); } else setQ(v); }}
      onKeyDown=${(e) => { if (e.key === 'Enter') { e.preventDefault(); add(q); } else if (e.key === 'Backspace' && !q && value.length) onChange(value.slice(0, -1)); }}
      onFocus=${() => setFocus(true)} onBlur=${() => setTimeout(() => { setFocus(false); if (q) add(q); }, 150)} />
    ${focus && sugg.length > 0 && html`<div class="pop"><div class="pop-list">
      ${sugg.map((t) => html`<button class="opt" onMouseDown=${(e) => { e.preventDefault(); add(t); }}><${Icon} n="tag" cls="sm" />${t}</button>`)}
    </div></div>`}
  </div>`;
}

/* Log a touchpoint: type, date, optional note. */
function Composer({ onSave, onCancel, autoFocus = true }) {
  const [type, setType] = useState('message');
  const [date, setDate] = useState(todayISO());
  const [note, setNote] = useState('');
  const ref = useRef();
  useEffect(() => { if (autoFocus && ref.current && window.matchMedia('(pointer:fine)').matches) ref.current.focus(); }, []);
  const save = () => onSave({ id: uid('i'), type, date: date || todayISO(), note: note.trim() });
  return html`<div class="composer" onKeyDown=${(e) => { if (e.key === 'Escape') { e.preventDefault(); onCancel(); } }}>
    <div class="seg" role="group" aria-label="How did you connect?">
      ${TOUCH.map(([k, l, ic]) => html`<button aria-pressed=${type === k} onClick=${() => setType(k)}><${Icon} n=${ic} cls="sm" />${l}</button>`)}
    </div>
    <div class="composer-row">
      <input ref=${ref} class="input" placeholder="What did you talk about? (optional)" value=${note}
        onInput=${(e) => setNote(e.target.value)} onKeyDown=${(e) => { if (e.key === 'Enter') save(); }} />
      <input class="input" type="date" value=${date} max=${todayISO()} onInput=${(e) => setDate(e.target.value)} aria-label="Date" />
    </div>
    <div class="composer-row" style="justify-content:flex-end">
      <button class="btn ghost sm" onClick=${onCancel}>Cancel</button>
      <button class="btn primary sm" onClick=${save}><${Icon} n="check" cls="sm" />Save touchpoint</button>
    </div>
  </div>`;
}

  const shown = showAll ? queue : queue.slice(0, 8);

const SORTS = [['tier', 'Circle'], ['name', 'Name'], ['due', 'Next reminder'], ['stale', 'Longest since talked'], ['recent', 'Recently talked'], ['added', 'Recently added']];
const GROUPS = [['none', 'No grouping'], ['tier', 'Circle'], ['location', 'Location'], ['company', 'Company'], ['tag', 'Tag'], ['status', 'Reminder status']];
const STATUS_FILTERS = [['', 'Any reminder status'], ['action', 'Needs attention'], ['overdue', 'Overdue'], ['soon', 'Due this week'], ['ok', 'On track'], ['none', 'No reminder']];

function sorter(key, t) {
  const by = {
    name: (a, b) => a.name.localeCompare(b.name),
    tier: (a, b) => a.tier - b.tier || a.name.localeCompare(b.name),
    recent: (a, b) => (b.lastContacted || '').localeCompare(a.lastContacted || '') || a.name.localeCompare(b.name),
    stale: (a, b) => (a.lastContacted || '').localeCompare(b.lastContacted || '') || a.tier - b.tier,
    added: (a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''),
    due: (a, b) => { const sa = statusOf(a, t), sb = statusOf(b, t); return sa.rank - sb.rank || (sa.sortDue || 0) - (sb.sortDue || 0) || a.name.localeCompare(b.name); },
  };
  return by[key] || by.tier;
}
function applyFilters(contacts, f, hay, t) {
  const tokens = norm(f.q).split(/\s+/).filter(Boolean);
  return contacts.filter((c) => {
    if (tokens.length) { const h = hay.get(c.id) || ''; if (!tokens.every((tk) => h.includes(tk))) return false; }
    if (f.tiers.length && !f.tiers.includes(c.tier)) return false;
    if (f.fav && !c.favorite) return false;
    if (f.locations.length && !f.locations.includes(c.location || '—')) return false;
    if (f.companies.length && !f.companies.includes(c.company || '—')) return false;
    if (f.tags.length && !f.tags.every((tg) => (c.tags || []).includes(tg))) return false;
    if (f.status) {
      const k = statusOf(c, t).key;
      if (f.status === 'action' && !(k === 'overdue' || k === 'unknown')) return false;
      if (f.status !== 'action' && f.status !== k) return false;
    }
    return true;
  });
}
function countBy(list, fn) {
  const m = new Map();
  for (const c of list) for (const v of [].concat(fn(c))) if (v) m.set(v, (m.get(v) || 0) + 1);
  return [...m.entries()].map(([value, count]) => ({ value, count })).sort((a, b) => b.count - a.count || String(a.value).localeCompare(String(b.value)));
}
function groupOf(c, by, settings, t) {
  switch (by) {
    case 'tier': return [`${c.tier}|${settings.tiers[c.tier - 1].label}`];
    case 'location': return [c.location || 'No location'];
    case 'company': return [c.company || 'No company'];
    case 'tag': return (c.tags || []).length ? c.tags : ['No tags'];
    case 'status': { const s = statusOf(c, t); return [`${s.rank}|${{ overdue: 'Overdue', unknown: 'Not logged yet', soon: 'Due this week', ok: 'On track', snoozed: 'Snoozed', none: 'No reminder' }[s.key]}`]; }
    default: return ['all'];
  }
}

function PersonCard({ c, settings, t, onOpen }) {

    <div class="pcard-foot"><span>${c.lastContacted ? 'Talked ' + ago(c.lastContacted) : 'No touchpoints yet'}</span><${StatusPill} s=${s} short /></div>
  </button>`;
}

function PeopleView({ contacts, settings, filters, setFilters, prefs, setPrefs, hay, onOpen, onAdd, onExport }) {
  const t = todayISO();
  const view = prefs.view || 'cards', sort = prefs.sort || 'tier', group = prefs.group || 'none';
  const [limit, setLimit] = useState(150);
  const searchRef = useRef();
  useEffect(() => setLimit(150), [JSON.stringify(filters), sort, group]);
  const filtered = useMemo(() => applyFilters(contacts, filters, hay, t).sort(sorter(sort, t)), [contacts, filters, sort, hay, t]);
  const locs = useMemo(() => countBy(contacts, (c) => c.location || '—'), [contacts]);
  const tags = useMemo(() => countBy(contacts, (c) => c.tags), [contacts]);
  const comps = useMemo(() => countBy(contacts, (c) => c.company || '—'), [contacts]);
  const tierCounts = useMemo(() => [1, 2, 3, 4].map((i) => contacts.filter((c) => c.tier === i).length), [contacts]);
  const set = (patch) => setFilters({ ...filters, ...patch });
  const active = filters.q || filters.tiers.length || filters.status || filters.locations.length || filters.tags.length || filters.companies.length || filters.fav;

  const groups = useMemo(() => {
    if (group === 'none') return [{ key: 'all', label: '', items: filtered }];
    const m = new Map();
    for (const c of filtered.slice(0, limit)) for (const g of groupOf(c, group, settings, t)) { if (!m.has(g)) m.set(g, []); m.get(g).push(c); }
    const keys = [...m.keys()];
    if (group === 'tier' || group === 'status') keys.sort();
    else keys.sort((a, b) => (/^No /.test(a) - /^No /.test(b)) || m.get(b).length - m.get(a).length || a.localeCompare(b));
    return keys.map((k) => ({ key: k, label: k.includes('|') ? k.split('|')[1] : k, items: m.get(k) }));
  }, [filtered, group, limit, settings]);

  const body = (items) => {
    const list = group === 'none' ? items.slice(0, limit) : items;
    if (view === 'cards') return html`<div class="cards">${list.map((c) => html`<${PersonCard} key=${c.id} c=${c} settings=${settings} t=${t} onOpen=${onOpen} />`)}</div>`;
    if (view === 'list') return html`<div class="lrows">${list.map((c) => { const s = statusOf(c, t); return html`<button key=${c.id} class="lrow" onClick=${() => onOpen(c.id)}>
      <${Avatar} c=${c} size=${36} />
      <div style="min-width:0"><div class="t">${c.name}</div><div class="s">${subline(c)}</div></div>
      <div class="s hide-sm">${[c.location, (c.tags || []).map((x) => '#' + x).join(' ')].filter(Boolean).join(' · ')}</div>
      <div style="display:flex;gap:6px"><span class="hide-sm"><${TierPill} tier=${c.tier} settings=${settings} short /></span><${StatusPill} s=${s} short /></div>
    </button>`; })}</div>`;
    const th = (k, l) => html`<th><button class=${sort === k ? 'on' : ''} onClick=${() => setPrefs({ sort: k })}>${l}${sort === k ? ' ↓' : ''}</button></th>`;
    return html`<div class="table-wrap"><table class="grid">
      <thead><tr>${th('name', 'Name')}${th('tier', 'Circle')}<th>Company</th><th>Role</th><th>Location</th><th>Tags</th>${th('recent', 'Last talked')}${th('due', 'Reminder')}<th>Email</th></tr></thead>
      <tbody>${list.map((c) => html`<tr key=${c.id} onClick=${() => onOpen(c.id)}>
        <td><div class="namecell"><${Avatar} c=${c} size=${28} />${c.name}</div></td>
        <td><${TierPill} tier=${c.tier} settings=${settings} /></td>
        <td>${c.company}</td><td class="muted">${c.role}</td><td>${c.location}</td>
        <td>${(c.tags || []).join(', ')}</td>
        <td class="num">${c.lastContacted ? fmtDate(c.lastContacted) : html`<span class="faint">—</span>`}</td>
        <td><${StatusPill} s=${statusOf(c, t)} short /></td>
        <td class="muted">${c.email}</td>
      </tr>`)}</tbody></table></div>`;
  };

  return html`<div class="page">
    <div class="page-h">
      <div><h1>People</h1><p>${plural(contacts.length, 'person')} in your village.</p></div>
      <div style="display:flex;gap:8px">
        <button class="btn" onClick=${onExport}><${Icon} n="download" cls="sm" />Export</button>
        <button class="btn primary" onClick=${onAdd}><${Icon} n="plus" cls="sm" />Add person</button>
      </div>
    </div>
    <div class="toolbar">
      <label class="search"><${Icon} n="search" /><span class="sr">Search people</span>
        <input ref=${searchRef} id="people-search" class="input" type="search" placeholder="Search names, companies, notes, tags…" value=${filters.q}
          onInput=${(e) => set({ q: e.target.value })} />
        ${filters.q && html`<button class="btn icon sm ghost clear" aria-label="Clear search" onClick=${() => set({ q: '' })}><${Icon} n="x" /></button>`}
      </label>
      <div class="toggle" role="group" aria-label="View">
        ${[['cards', 'grid', 'Cards'], ['list', 'list', 'List'], ['table', 'table', 'Table']].map(([k, ic, l]) => html`<button aria-pressed=${view === k} onClick=${() => setPrefs({ view: k })} title=${l}><${Icon} n=${ic} cls="sm" /><span class="hide-xs">${l}</span></button>`)}
      </div>
    </div>
    <div class="filterbar">
      ${settings.tiers.map((tier, i) => html`<button class=${'fchip' + (filters.tiers.includes(i + 1) ? ' on' : '')}
        onClick=${() => set({ tiers: filters.tiers.includes(i + 1) ? filters.tiers.filter((x) => x !== i + 1) : [...filters.tiers, i + 1] })}>
        <span class=${'tier-dot'} style=${{ color: `var(--${['gold', 'rose', 'sky', 'ink-3'][i]})` }}></span>${tier.label}<span class="c num">${tierCounts[i]}</span></button>`)}
      <${Menu} trigger=${(tg) => html`<button class=${'fchip' + (filters.status ? ' on' : '')} onClick=${tg}><${Icon} n="clock" cls="sm" />${filters.status ? STATUS_FILTERS.find((s) => s[0] === filters.status)[1] : 'Reminders'}<${Icon} n="chev" cls="sm" /></button>`}
        items=${STATUS_FILTERS.map(([k, l]) => ({ label: l, run: () => set({ status: k }) }))} />
      <${MultiSelect} label="Location" icon="pin" options=${locs} selected=${filters.locations} onChange=${(v) => set({ locations: v })} />
      <${MultiSelect} label="Tags" icon="tag" options=${tags} selected=${filters.tags} onChange=${(v) => set({ tags: v })} />
      <${MultiSelect} label="Company" icon="building" options=${comps} selected=${filters.companies} onChange=${(v) => set({ companies: v })} right />
      <button class=${'fchip' + (filters.fav ? ' on' : '')} onClick=${() => set({ fav: !filters.fav })}><${Icon} n="star" cls="sm" />Favorites</button>
      ${active && html`<button class="btn sm ghost" onClick=${() => setFilters(EMPTY_FILTERS)}><${Icon} n="x" cls="sm" />Clear filters</button>`}
    </div>
    <div class="resultbar">
      <span class="num">${filtered.length === contacts.length ? `Showing everyone (${contacts.length})` : `${filtered.length} of ${contacts.length} people`}</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <label style="display:flex;align-items:center;gap:6px">Sort <select class="select" style="width:auto;min-height:34px" value=${sort} onChange=${(e) => setPrefs({ sort: e.target.value })}>${SORTS.map(([k, l]) => html`<option value=${k}>${l}</option>`)}</select></label>
        <label style="display:flex;align-items:center;gap:6px">Group <select class="select" style="width:auto;min-height:34px" value=${group} onChange=${(e) => setPrefs({ group: e.target.value })}>${GROUPS.map(([k, l]) => html`<option value=${k}>${l}</option>`)}</select></label>
      </div>
    </div>
    ${filtered.length === 0
      ? html`<div class="panel empty"><h3>${contacts.length ? 'Nobody matches that.' : 'No one here yet.'}</h3><span>${contacts.length ? 'Try fewer filters or a different search.' : 'Import your contacts or add someone by hand.'}</span>
          ${contacts.length ? html`<button class="btn" onClick=${() => setFilters(EMPTY_FILTERS)}>Clear filters</button>` : html`<button class="btn primary" onClick=${onAdd}>Add person</button>`}</div>`
      : groups.map((g) => html`<section key=${g.key}>
          ${g.label && html`<div class="group-h"><h3>${g.label}</h3><span class="faint num">${g.items.length}</span></div>`}
          ${body(g.items)}
        </section>`)}
    ${filtered.length > limit && html`<button class="btn block" onClick=${() => setLimit(limit + 300)}>Show more (${filtered.length - limit} left)</button>`}
  </div>`;
}

/* =========================================================
   Network: orbit visualization + breakdowns
   ========================================================= */
function Orbit({ contacts, settings, colorBy, onOpen }) {
  const t = todayISO();
  const [tip, setTip] = useState(null);
  const wrap = useRef();
  const [width, setWidth] = useState(700);
  useEffect(() => {
    if (!wrap.current || typeof ResizeObserver === 'undefined') return;
    const ro = new ResizeObserver((es) => setWidth(Math.round(es[0].contentRect.width)));
    ro.observe(wrap.current);
    return () => ro.disconnect();
  }, []);
  const S = 820, C = S / 2;
  const R = [0, 118, 206, 292, 372];
  const zoom = Math.min(1.9, Math.max(1, 600 / Math.max(width, 1)));  // bigger dots on small screens
  const MAX = [0, 300, 400, 500, 900];
  const GAP = 0.5; // gap at the bottom of each ring for its label
  const places = useMemo(() => countBy(contacts, (c) => c.location).slice(0, 7).map((x) => x.value), [contacts]);
  const { nodes, more } = useMemo(() => {
    const nodes = []; const more = [];
    for (let tier = 1; tier <= 4; tier++) {
      const list = contacts.filter((c) => c.tier === tier).sort((a, b) => norm(a.location || '~').localeCompare(norm(b.location || '~')) || a.name.localeCompare(b.name));
      const shown = list.slice(0, MAX[tier]);
      if (list.length > shown.length) more.push({ tier, n: list.length - shown.length });
      if (!shown.length) continue;
      const base = [0, 21, 16, 13, list.length < 80 ? 11 : 6][tier];
      let nr = Math.round(base * zoom), cap, k;
      const fit = () => { cap = Math.max(1, Math.floor(((2 * Math.PI - GAP) * R[tier]) / (nr * 2 + 4))); k = Math.ceil(shown.length / cap); };
      fit();
      while (k > 3 && nr > 4) { nr -= 1; fit(); }
      shown.forEach((c, j) => {
        const sub = j % k, idx = Math.floor(j / k);
        const n = Math.ceil((shown.length - sub) / k);
        const span = 2 * Math.PI - GAP;
        const ang = Math.PI / 2 + GAP / 2 + ((idx + 0.5 + sub / k) / n) * span;
        const rr = R[tier] + (sub - (k - 1) / 2) * (nr * 2 + 3);
        nodes.push({ c, x: C + rr * Math.cos(ang), y: C + rr * Math.sin(ang), r: nr, tier });
      });
    }
    return { nodes, more };
  }, [contacts, zoom]);
  const cls = (c) => {
    if (colorBy === 'place') { const i = places.indexOf(c.location); return 'n-' + (i >= 0 ? 'p' + i : 'px'); }
    return 'n-' + statusOf(c, t).key;
  };
  const show = (e, nd) => {
    const w = wrap.current.getBoundingClientRect();
    const box = wrap.current.querySelector('svg').getBoundingClientRect();
    const scale = box.width / S;
    setTip({ x: box.left - w.left + nd.x * scale, y: box.top - w.top + (nd.y - nd.r) * scale, c: nd.c });
  };
  return html`<div class="orbit-wrap" ref=${wrap} onPointerLeave=${() => setTip(null)}>
    <svg class="orbit" viewBox=${`0 0 ${S} ${S}`} role="img" aria-label="Your network arranged in circles by closeness">
      ${[4, 3, 2, 1].map((tier) => html`<circle class=${'band band-' + tier} cx=${C} cy=${C} r=${R[tier] + (tier === 4 ? 40 : 44)} />`)}
      ${[1, 2, 3, 4].map((tier) => html`<circle class="ring" cx=${C} cy=${C} r=${R[tier]} stroke-dasharray=${tier === 4 ? '3 6' : ''} />`)}
      <circle class="core" cx=${C} cy=${C} r=${Math.round(44 * Math.min(zoom, 1.4))} />
      <text class="core-t" x=${C} y=${C} style=${{ fontSize: Math.round(18 * Math.min(zoom, 1.4)) + 'px' }}>You</text>
      ${[1, 2, 3, 4].map((tier) => {
        const m = more.find((x) => x.tier === tier);
        const label = settings.tiers[tier - 1].label + (m ? ` · +${m.n}` : '');
        const fs = Math.round(12 * zoom), w = label.length * fs * 0.56 + fs * 1.4, hgt = fs * 1.8;
        return html`<g key=${'l' + tier}><rect class="ring-label-bg" x=${C - w / 2} y=${C + R[tier] - hgt / 2} width=${w} height=${hgt} rx=${hgt / 2} />
          <text class="ring-label" x=${C} y=${C + R[tier]} dominant-baseline="central" style=${{ fontSize: fs + 'px' }}>${label}</text></g>`;
      })}
      ${nodes.map((nd) => html`<g key=${nd.c.id} class="node" tabindex="0" role="button" aria-label=${nd.c.name}
          onClick=${() => onOpen(nd.c.id)} onKeyDown=${(e) => { if (e.key === 'Enter') onOpen(nd.c.id); }}
          onPointerEnter=${(e) => show(e, nd)} onFocus=${(e) => show(e, nd)} onBlur=${() => setTip(null)}>
        <circle class=${cls(nd.c)} cx=${nd.x} cy=${nd.y} r=${nd.r} style=${nd.r < 8 ? 'stroke-width:1' : ''} />
        ${nd.r >= 11 && html`<text x=${nd.x} y=${nd.y} style=${{ fontSize: Math.round(nd.r * 0.72) + 'px' }}>${initials(nd.c.name)}</text>`}
      </g>`)}
    </svg>
    ${tip && html`<div class="orbit-tip" style=${{ left: tip.x + 'px', top: tip.y + 'px' }}><b>${tip.c.name}</b>${[subline(tip.c), tip.c.location].filter(Boolean).join(' · ') || settings.tiers[tip.c.tier - 1].label}</div>`}
    <div class="legend" style="margin-top:8px">
      ${colorBy === 'place'
        ? [...places.map((p, i) => html`<span><i style=${{ background: `var(--${['accent', 'rose', 'sky', 'gold', 'amber', 'ok', 'coral'][i]})` }}></i>${p}</span>`), html`<span><i style="background:var(--ink-3)"></i>Elsewhere</span>`]
        : [['ok', 'On track'], ['amber', 'Due soon / not logged'], ['coral', 'Overdue'], ['sky', 'Snoozed'], ['ink-3', 'No reminder']].map(([v, l]) => html`<span><i style=${{ background: `var(--${v})` }}></i>${l}</span>`)}
    </div>
  </div>`;
}

function Bars({ rows, onPick, empty }) {
  if (!rows.length) return html`<p class="faint" style="margin:0">${empty}</p>`;
  const max = rows[0].count;
  return html`<div class="bars">${rows.map((r) => html`<button class="bar" onClick=${() => onPick(r.value)}>
    <span class="lbl"><i style=${{ width: (r.count / max) * 100 + '%' }}></i>${r.value}</span><span class="n num">${r.count}</span>
  </button>`)}</div>`;
}

function NetworkView({ contacts, settings, onOpen, drill, prefs, setPrefs }) {
  const colorBy = prefs.colorBy || 'status';
  const [tiers, setTiers] = useState([1, 2, 3, 4]);
  const shown = contacts.filter((c) => tiers.includes(c.tier));
  const places = countBy(contacts, (c) => c.location).slice(0, 8);
  const comps = countBy(contacts, (c) => c.company).slice(0, 8);
  const tags = countBy(contacts, (c) => c.tags).slice(0, 10);
  const met = countBy(contacts, (c) => c.howWeMet).slice(0, 6);
  const cities = new Set(contacts.map((c) => norm(c.location)).filter(Boolean)).size;
  const companies = new Set(contacts.map((c) => norm(c.company)).filter(Boolean)).size;
  const t = todayISO();
  const talked90 = contacts.filter((c) => c.lastContacted && diffDays(t, c.lastContacted) <= 90).length;
  return html`<div class="page">
    <div class="page-h"><div><h1>Your network</h1><p>Everyone in orbit. Closer rings are closer people. Tap anyone to open them.</p></div></div>
    <div class="stat-row">
      <div class="stat"><b class="num">${contacts.length}</b><span>people</span></div>
      <div class="stat"><b class="num">${cities}</b><span>${cities === 1 ? 'city' : 'cities'}</span></div>
      <div class="stat"><b class="num">${companies}</b><span>companies</span></div>

    </div>
    <div class="net-grid">
      <div class="panel">
        <div class="panel-h" style="flex-wrap:wrap">
          <div class="filterbar">${settings.tiers.map((tr, i) => html`<button class=${'fchip' + (tiers.includes(i + 1) ? ' on' : '')} onClick=${() => setTiers(tiers.includes(i + 1) ? tiers.filter((x) => x !== i + 1) : [...tiers, i + 1].sort())}>${tr.label}</button>`)}</div>
          <div class="toggle" role="group" aria-label="Color by">
            <button aria-pressed=${colorBy === 'status'} onClick=${() => setPrefs({ colorBy: 'status' })}>Reminders</button>
            <button aria-pressed=${colorBy === 'place'} onClick=${() => setPrefs({ colorBy: 'place' })}>Places</button>
          </div>
        </div>
        ${contacts.length ? html`<${Orbit} contacts=${shown} settings=${settings} colorBy=${colorBy} onOpen=${onOpen} />` : html`<div class="empty"><h3>Your orbit is empty.</h3><span>Import or add people to see them here.</span></div>`}
      </div>
      <div class="net-side">
        <div class="panel"><div class="panel-h"><h2>Places</h2><span class="faint">tap to filter</span></div><${Bars} rows=${places} onPick=${(v) => drill({ locations: [v] })} empty="Add locations to see where your people are." /></div>
        <div class="panel"><div class="panel-h"><h2>Companies</h2></div><${Bars} rows=${comps} onPick=${(v) => drill({ companies: [v] })} empty="No companies yet." /></div>
        <div class="panel"><div class="panel-h"><h2>Tags</h2></div>
          ${tags.length ? html`<div class="chips">${tags.map((x) => html`<button class="fchip" onClick=${() => drill({ tags: [x.value] })}>#${x.value}<span class="c num">${x.count}</span></button>`)}</div>` : html`<p class="faint" style="margin:0">Tags like #college or #climbing let you slice your network any way you like.</p>`}
        </div>
        ${met.length > 0 && html`<div class="panel"><div class="panel-h"><h2>How you met</h2></div><${Bars} rows=${met} onPick=${(v) => drill({ q: v })} empty="" /></div>`}
      </div>
    </div>
  </div>`;
}

function PersonSheet({ contact, isNew, settings, allTags, onSave, onDelete, onClose, act, toast }) {
  const [d, setD] = useState(contact);
  const dRef = useRef(contact);
  const timer = useRef(null);
  const dirty = useRef(false);
  const [logging, setLogging] = useState(false);
  const [armed, setArmed] = useState(false);
  const nameRef = useRef();
  // Adopt changes made elsewhere, but never let the echo of an older save of ours overwrite newer edits.
  useEffect(() => {
    if (dirty.current) return;
    if ((contact.updatedAt || '') < (dRef.current.updatedAt || '')) return;
    setD(contact); dRef.current = contact;
  }, [contact]);
  const sheetRef = useRef();
  // Move focus into the dialog so keys never reach the page behind it.
  useLayoutEffect(() => {
    if (isNew && nameRef.current) nameRef.current.focus();
    else if (sheetRef.current) sheetRef.current.focus({ preventScroll: true });
  }, []);
  useEffect(() => { if (!armed) return; const tm = setTimeout(() => setArmed(false), 3500); return () => clearTimeout(tm); }, [armed]);
  const flush = () => {
    clearTimeout(timer.current);
    if (!dirty.current) return;
    dirty.current = false;
    const c = dRef.current;
    if (!c.name.trim()) return;
    const stamp = nowStamp();
    dRef.current = { ...c, updatedAt: stamp };
    onSave({ ...c, name: c.name.trim(), updatedAt: stamp });
  };
  const set = (patch, now) => {
    const next = { ...dRef.current, ...patch };
    dRef.current = next; setD(next); dirty.current = true;
    clearTimeout(timer.current);
    if (now) flush(); else timer.current = setTimeout(flush, 600);
  };
  const close = () => { flush(); onClose(); };
  useLayoutEffect(() => {
    const k = (e) => { if (e.key === 'Escape' && !e.defaultPrevented) close(); };
    document.addEventListener('keydown', k);
    return () => { document.removeEventListener('keydown', k); };
  }, []);
  useEffect(() => () => flush(), []);

  const s = statusOf(d);
  const copy = async (v, what) => { try { await navigator.clipboard.writeText(v); toast(`${what} copied`); } catch (e) { toast(v); } };
  const inter = [...(d.interactions || [])].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const extras = Object.entries(d.extra || {});
  const field = (k, label, icon, type = 'text', ph = '') => html`<label class="fld"><span>${icon && html`<${Icon} n=${icon} cls="sm" />`}${label}</span>
    <input class="input" type=${type} value=${d[k] || ''} placeholder=${ph} onInput=${(e) => set({ [k]: e.target.value })} onBlur=${flush} /></label>`;
  const bdayValue = d.birthday && !d.birthday.startsWith('--') ? d.birthday : '';

  return html`<${Fragment}>
    <div class="scrim" onClick=${close}></div>
    <aside class="sheet" ref=${sheetRef} tabindex="-1" style="outline:none" role="dialog" aria-modal="true" aria-label=${d.name || 'New person'}>
      <div class="sheet-bar">
        <button class="btn icon ghost" onClick=${close} aria-label="Close"><${Icon} n="x" /></button>
        <span class="grow faint" style="font-size:13px">${isNew && !contact.name ? 'New person · saves as you type' : d.updatedAt ? 'Saved' : ''}</span>
        <button class="btn icon ghost" aria-pressed=${!!d.favorite} title=${d.favorite ? 'Unfavorite' : 'Favorite'} onClick=${() => set({ favorite: !d.favorite }, true)}
          style=${d.favorite ? 'color:var(--gold)' : ''}><svg class="i" viewBox="0 0 24 24" style=${d.favorite ? 'fill:currentColor' : ''} dangerouslySetInnerHTML=${{ __html: ICONS.star }}></svg></button>
      </div>
      <div class="sheet-body">
        <div class="p-head">
          <${Avatar} c=${d} size=${68} />
          <div class="grow">
            <input ref=${nameRef} class="bare name" value=${d.name} placeholder="Their name" aria-label="Name" onInput=${(e) => set({ name: e.target.value })} onBlur=${flush} />
            <div class="role-line">
              <input class="bare sub" value=${d.role} placeholder="Role" aria-label="Role" onInput=${(e) => set({ role: e.target.value })} onBlur=${flush} />
              <span>at</span>
              <input class="bare sub" value=${d.company} placeholder="Company" aria-label="Company" onInput=${(e) => set({ company: e.target.value })} onBlur=${flush} />
            </div>
          </div>
        </div>

        ${d.name.trim() && html`<div class="quick">

function Palette({ contacts, hay, onClose, onOpen, go, onAdd }) {
  const [q, setQ] = useState('');
  const [i, setI] = useState(0);
  const inRef = useRef();
  useEffect(() => { inRef.current && inRef.current.focus(); }, []);
  const tokens = norm(q).split(/\s+/).filter(Boolean);
  const people = (tokens.length ? contacts.filter((c) => tokens.every((tk) => (hay.get(c.id) || '').includes(tk))) : contacts.slice().sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || '')))
    .sort((a, b) => tokens.length ? (norm(b.name).startsWith(tokens[0]) - norm(a.name).startsWith(tokens[0])) : 0).slice(0, 8);
  const actions = [
    { label: 'Add a person', icon: 'plus', run: onAdd },
    { label: 'Go to Today', icon: 'sun', run: () => go('today') },
    { label: 'Go to People', icon: 'users', run: () => go('people') },
    { label: 'Go to Network', icon: 'orbit', run: () => go('network') },
    { label: 'Import contacts', icon: 'upload', run: () => go('import') },
    { label: 'Settings and backup', icon: 'sliders', run: () => go('settings') },
  ].filter((a) => !tokens.length || tokens.every((tk) => norm(a.label).includes(tk)));
  const items = [...people.map((c) => ({ c, run: () => onOpen(c.id) })), ...actions];
  const pick = (it) => { onClose(); it.run(); };
  return html`<${Fragment}>
    <div class="scrim" onClick=${onClose} style="z-index:69"></div>
    <div class="modal" role="dialog" aria-label="Search">
      <div class="pal-in"><${Icon} n="search" />
        <input ref=${inRef} placeholder="Search people or jump to…" value=${q} onInput=${(e) => { setQ(e.target.value); setI(0); }}
          onKeyDown=${(e) => {
            if (e.key === 'ArrowDown') { e.preventDefault(); setI(Math.min(i + 1, items.length - 1)); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); setI(Math.max(i - 1, 0)); }
            else if (e.key === 'Enter' && items[i]) pick(items[i]);
            else if (e.key === 'Escape') { e.preventDefault(); onClose(); }
          }} />
        <span class="kbd">esc</span>
      </div>
      <div class="pal-list">
        ${people.length > 0 && html`<div class="pal-sec eyebrow">People</div>`}
        ${people.map((c, j) => html`<button class=${'opt' + (i === j ? ' active' : '')} onMouseEnter=${() => setI(j)} onClick=${() => pick(items[j])}>
          <${Avatar} c=${c} size=${30} /><span style="min-width:0"><b>${c.name}</b> <span class="faint">${subline(c)}</span></span></button>`)}
        ${actions.length > 0 && html`<div class="pal-sec eyebrow">Actions</div>`}
        ${actions.map((a, k) => { const j = people.length + k; return html`<button class=${'opt' + (i === j ? ' active' : '')} onMouseEnter=${() => setI(j)} onClick=${() => pick(a)}><${Icon} n=${a.icon} />${a.label}</button>`; })}
        ${items.length === 0 && html`<div class="faint" style="padding:16px">No matches for “${q}”.</div>`}
      </div>
    </div>
  <//>`;
}

const SOURCE_INFO = {
  phone: { label: 'Phone contacts', tag: 'phone', tier: 4 },
  linkedin: { label: 'LinkedIn', tag: 'linkedin', tier: 4 },
  notion: { label: 'Notion', tag: 'notion', tier: 3 },
  csv: { label: 'Spreadsheet', tag: '', tier: 3 },
  backup: { label: 'MyVillage backup', tag: '', tier: 3 },
  ai: { label: 'Smart paste', tag: '', tier: 3 },
};

async function readFileText(file) { return await file.text(); }

async function parseFile(file, hint) {
  const name = file.name || 'file';
  const text = await readFileText(file);
  if (/\.json$/i.test(name) || /^\s*\{/.test(text)) {
    const j = JSON.parse(text);
    const list = Array.isArray(j) ? j : j.contacts;
    if (!Array.isArray(list)) throw new Error('That JSON file is not a MyVillage backup.');
    return { source: 'backup', fileName: name, kind: 'records', records: list.map((c) => normalizeContact(c)), settings: j.settings || null };
  }
  if (/\.vcf$|\.vcard$/i.test(name) || /BEGIN:VCARD/i.test(text.slice(0, 2000))) {
    const recs = parseVCF(text);
    if (!recs.length) throw new Error('No contacts found in that vCard file.');
    return { source: 'phone', fileName: name, kind: 'records', records: recs };
  }
  const rows = parseCSV(text);
  if (rows.length < 2) throw new Error('That file has no rows to import. Use a .csv, .vcf or MyVillage .json file.');
  const hi = findHeaderRow(rows);
  const headers = rows[hi].map((x) => x.trim());
  const body = rows.slice(hi + 1);
  const hn = headers.map(norm);
  let source = hint || 'csv';
  if (hn.includes('first name') && hn.includes('connected on')) source = 'linkedin';
  else if (hn.some((x) => /given name|e-mail 1 - value/.test(x))) source = 'phone';
  else if (/notion/i.test(name) || /\s[0-9a-f]{32}(_all)?\.csv$/i.test(name)) source = 'notion';
  const mapping = headers.map((hd, i) => guessField(hd, body.slice(0, 25).map((r) => (r[i] || '').trim())));
  if (!mapping.some((m) => m === 'name' || m === 'firstName')) {
    const first = mapping.findIndex((m) => m !== 'skip');
    mapping[first >= 0 ? first : 0] = 'name';
  }
  return { source, fileName: name, kind: 'csv', headers, rows: body, mapping };
}
